<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Moonaroon</title>
  </head>
  <body>
    <div class="header">
      <img class="moon" src="icons/moon.svg" alt="" width="34" height="34" />
      <div class="titles">
        <h1>Moonaroon</h1>
        <p data-i18n="tagline">Dark mode for cybozu.com</p>
      </div>
      <div class="aside">
        <div class="lang">
          <!-- Options are built in popup.js from LANGS, so adding a language means
               touching strings.js only. -->
          <select id="lang" class="lang-select" data-i18n-title="langLabel"></select>
          <svg class="lang-caret" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 3.5 5 7.5 9 3.5" />
          </svg>
        </div>
        <a
          id="report"
          class="report"
          href="https://github.com/jmadelaine/moonaroon/issues/new"
          target="_blank"
          rel="noreferrer"
          data-i18n-title="reportBug"
        >
          <!-- Material Symbols "bug_report". Fill comes from currentColor so it
               dims and lifts with the aside beside it. -->
          <svg class="bug-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="M480-216q48.67 0 83.34-35Q598-286 600-336v-192q2-50-33.5-85t-86-35q-50.5 0-85 35T360-528v192q-1 50 34 85t86 35Zm-72-120h144v-72H408v72Zm0-120h144v-72H408v72Zm72 26Zm0 286q-60 0-109-32.5T302-264H192v-72h96v-60h-96v-72h96v-60h-96v-72h110q8-26 25.8-47.09Q345.6-668.18 369-684l-81-81 51-51 101 100q19.86-5 40.43-5t40.57 5l100-100 51 51-81 81q23 16 40 37t27 47h110v72h-96v60h96v72h-96v60h96v72H658q-20 55-69 87.5T480-144Z"
            />
          </svg>
        </a>
      </div>
    </div>

    <label class="row" for="toggle">
      <span class="label-text" id="label">Dark mode</span>
      <span class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </span>
    </label>

    <script src="strings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
