<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Moonaroon</title>
  </head>
  <body>
    <div class="header">
      <img class="moon" src="icons/moon.svg" alt="" width="28" height="28" />
      <div class="titles">
        <h1>Moonaroon</h1>
        <p>Dark mode for cybozu.com</p>
      </div>
      <a
        id="report"
        class="report"
        href="https://github.com/jmadelaine/moonaroon/issues/new"
        target="_blank"
        rel="noreferrer"
        >Found a bug?</a
      >
    </div>

    <label class="row" for="toggle">
      <span class="label-text" id="label">Dark mode</span>
      <span class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </span>
    </label>

    <script src="popup.js"></script>
  </body>
</html>
